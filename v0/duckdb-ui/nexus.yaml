# spec path: github.com/rdkal/nexus-infra/v0/duckdb-ui

# Required — self-referencing forces a loud failure at build time if unset, same
# pattern as traefik/authelia's required secrets. Not a secret itself: the directory
# this SQL console opens (relative-path queries resolve against it, same as a human
# `cd`'d there on a terminal). A consumer project overrides it — see README.md.
environment:
  DUCKDB_UI_DATA_DIR: ${DUCKDB_UI_DATA_DIR}

build: |
  set -eu
  VERSION="v1.5.4"
  if [ ! -x "$NEXUS_VOLUME_BIN/duckdb" ]; then
    curl -fL "https://github.com/duckdb/duckdb/releases/download/${VERSION}/duckdb_cli-linux-amd64.gz" -o /tmp/duckdb.gz
    gunzip -c /tmp/duckdb.gz > "$NEXUS_VOLUME_BIN/duckdb"
    chmod +x "$NEXUS_VOLUME_BIN/duckdb"
  fi
  # Pre-fetch the `ui` extension once here (needs network — the only point this
  # project ever touches the internet). The extension bundles its own frontend
  # assets, so the service itself serves everything locally afterward with no
  # runtime dependency on ui.duckdb.org. HOME is scoped to this volume for both
  # this and the service's own run: below, so the extension cache lands inside
  # $NEXUS_VOLUME_BIN, not the operator's own ~/.duckdb.
  HOME="$NEXUS_VOLUME_BIN" "$NEXUS_VOLUME_BIN/duckdb" -c "INSTALL ui;"
  # The ui extension writes its own internal `_duckdb_ui` catalog into
  # whatever database file it's opened against — saved notebooks, queries,
  # session state. Confirmed live: `-readonly` blocks that write and breaks
  # UI initialization outright ("Binder Error: Catalog _duckdb_ui does not
  # exist!" / a RangeError deeper in a different code path depending on
  # which auth fallback fires first) — read-write is not just a safety
  # tradeoff here, `-readonly` genuinely does not work with `-ui`. So this
  # file is real persistent state now, not a throwaway — see the `data`
  # volume below, not `bin`.
  if [ ! -f "$NEXUS_VOLUME_DATA/catalog.duckdb" ]; then
    HOME="$NEXUS_VOLUME_BIN" "$NEXUS_VOLUME_BIN/duckdb" "$NEXUS_VOLUME_DATA/catalog.duckdb" -c "SELECT 1;"
  fi
  # See services.duckdb-ui.run below for why this FIFO exists.
  [ -p "$NEXUS_VOLUME_BIN/stdin.fifo" ] || mkfifo "$NEXUS_VOLUME_BIN/stdin.fifo"

volumes:
  bin: {}    # downloaded duckdb binary, its extension cache, and stdin.fifo (all HOME/run-scoped here)
  data: {}   # catalog.duckdb — the ui extension's own state (saved notebooks/queries), not the Parquet tree it's querying (that's DUCKDB_UI_DATA_DIR, owned by the consumer)

services:
  duckdb-ui:
    # The `-ui` web server's lifetime is tied to the CLI's own stdin loop — it
    # exits the instant stdin hits EOF (confirmed live: there is no separate
    # daemon/headless mode), so stdin has to stay open forever for this to work
    # as a long-lived service at all.
    #
    # NOT `sleep infinity | duckdb -ui ...`: that pipe is two processes (the
    # shell + the piped `sleep`), so when Nexus stops the service it only
    # signals the process it started — the wrapper shell — and `duckdb`,
    # having lost its parent, is orphaned still holding the port. Confirmed
    # live: this left a stuck instance of the *previous* release running
    # after this exact deploy, requiring a manual kill to unstick. `exec`
    # replaces the shell with `duckdb` in place (same PID, no wrapper for
    # Nexus to lose track of), and `<> stdin.fifo` (open for read+write on a
    # FIFO, not a pipe) blocks forever on read without needing a second
    # process to hold the write end open — one process, no orphan risk.
    #
    # Binds [::1]:4213 (IPv6 loopback ONLY — confirmed live; NOT 127.0.0.1,
    # there's no setting to change the bind host, only ui_local_port for the
    # port). A consumer's Traefik route must target http://[::1]:4213, not
    # 127.0.0.1. cwd is DUCKDB_UI_DATA_DIR so relative-path queries
    # (read_parquet('raw/...')) work exactly like a human `cd`'d there on a
    # terminal. Read-write against catalog.duckdb (see build: above for why
    # -readonly isn't an option) — anyone with access to the console can
    # CREATE TABLE/COPY ... TO into DUCKDB_UI_DATA_DIR, same trust level as
    # already having shell access to the host.
    run: >
      sh -c 'cd "$DUCKDB_UI_DATA_DIR" && HOME="$NEXUS_VOLUME_BIN" exec "$NEXUS_VOLUME_BIN/duckdb" -ui "$NEXUS_VOLUME_DATA/catalog.duckdb" <> "$NEXUS_VOLUME_BIN/stdin.fifo"'
