# spec path: github.com/rdkal/nexus-infra/v0/authelia

# Required secrets/config — set these in $NEXUS_HOME/env/authelia.env (operator file,
# not in git). Self-referencing here forces the deploy to fail loudly if any is
# missing, instead of silently rendering a broken config.
environment:
  AUTHELIA_JWT_SECRET: ${AUTHELIA_JWT_SECRET}
  AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
  AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
  # Plain names (no AUTHELIA_ prefix) — these are ours, not real Authelia settings.
  # AUTHELIA_* is Authelia's own env-injection convention; using it for our own
  # template variables caused spurious "environment variable not expected"
  # warnings on every start.
  COOKIE_DOMAIN: ${COOKIE_DOMAIN}
  SUBDOMAIN: ${SUBDOMAIN}
  # Traefik's dynamic volume, injected by nexus for every deployed project — requires
  # the traefik project to already be deployed (see nexus DESIGN.md: "the provider
  # must be deployed before the consumer for its variable to exist").
  #
  # The `:-` default is deliberate, not cosmetic: when this project is *nested* under
  # a parent (e.g. retu/authelia), NEXUS_TRAEFIK_DYNAMIC doesn't exist at all — the
  # parent's own environment: override supplies the real value (e.g.
  # NEXUS_RETU_TRAEFIK_DYNAMIC) instead. Nexus currently validates this project's own
  # committed default even when a parent override will replace it (see
  # github.com/rdkal/nexus issue for the bug report), so a hard reference here would
  # fail nested deploys before the override ever gets a chance to apply. Root-level
  # use is unaffected: NEXUS_TRAEFIK_DYNAMIC is genuinely defined there.
  TRAEFIK_DYNAMIC_DIR: ${NEXUS_TRAEFIK_DYNAMIC:-}

build: |
  set -eu
  VERSION="v4.39.11"
  if [ ! -x "$NEXUS_VOLUME_BIN/authelia" ]; then
    curl -fL "https://github.com/authelia/authelia/releases/download/${VERSION}/authelia-${VERSION}-linux-amd64.tar.gz" -o /tmp/authelia.tar.gz
    tar -xzf /tmp/authelia.tar.gz -C /tmp authelia
    mv /tmp/authelia "$NEXUS_VOLUME_BIN/authelia"
    chmod +x "$NEXUS_VOLUME_BIN/authelia"
  fi
  mkdir -p "$NEXUS_VOLUME_DATA"
  # Rendered once, then hand-edited in place (access_control rules, users) — never
  # overwritten by later deploys. Delete the file manually to force a re-render.
  if [ ! -f "$NEXUS_VOLUME_CONFIG/configuration.yml" ]; then
    envsubst < config/configuration.yml.tmpl > "$NEXUS_VOLUME_CONFIG/configuration.yml"
  fi
  if [ ! -f "$NEXUS_VOLUME_CONFIG/users_database.yml" ]; then
    cp config/users_database.yml.example "$NEXUS_VOLUME_CONFIG/users_database.yml"
  fi
  # Publish our own Traefik route + a reusable forward-auth middleware into
  # traefik's dynamic volume — the concrete extension-point handshake documented
  # in ../traefik/README.md. Any other project just references "authelia@file" as
  # a middleware on its own route fragment to require auth.
  if [ -n "${TRAEFIK_DYNAMIC_DIR:-}" ]; then
    envsubst < config/traefik-dynamic.yml.tmpl > "$TRAEFIK_DYNAMIC_DIR/authelia.yml"
  else
    echo "WARNING: TRAEFIK_DYNAMIC_DIR is unset — skipping traefik route publish. Set it (directly at root level, or via a parent's environment: override when nested) to wire this authelia into traefik." >&2
  fi

volumes:
  bin: {}      # downloaded authelia binary
  config: {}   # rendered configuration.yml + users_database.yml
  data: {}     # sqlite db (auth sessions/history) + notification file

services:
  authelia:
    run: >
      $NEXUS_VOLUME_BIN/authelia
      --config $NEXUS_VOLUME_CONFIG/configuration.yml
# forced rebuild trigger 1784873061
